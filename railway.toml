# ── Railway config for the FastAPI backend service ───────────────────────────
# Deploy this service from the repo root using Dockerfile.api.
#
# In your Railway project you will have TWO services:
#   1. This service (API)      — Dockerfile.api at repo root
#   2. Frontend service        — Next.js from the /frontend subdirectory
#
# See README.md → Railway Deployment for step-by-step instructions.

[build]
dockerfilePath = "Dockerfile.api"

[deploy]
# start.sh runs startup_ingest.py in the background then execs uvicorn as PID 1.
# Using exec ensures Railway signals and health checks are handled correctly.
startCommand = "sh /app/start.sh"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Health check — Railway polls GET /health on $PORT.
# 300 s timeout gives uvicorn time to start even if startup_ingest is slow.
healthcheckPath = "/health"
healthcheckTimeout = 300
